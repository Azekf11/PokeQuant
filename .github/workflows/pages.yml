name: Web demo

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the site files only (no test tooling)
        run: |
          mkdir -p _site/data
          cp apps/web/index.html apps/web/style.css apps/web/app.js apps/web/icon.svg _site/
          cp apps/web/data/results.json apps/web/data/results.js _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
