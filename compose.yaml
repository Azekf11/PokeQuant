# Local demo: serves the static web page at http://localhost:8080 (read-only).
services:
  web:
    image: nginx:1.27.2-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
